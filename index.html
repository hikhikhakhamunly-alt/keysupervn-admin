$("p-save").onclick=async()=>{
  const admin=await currentAdmin();
  if(!admin)return toast("Tài khoản chưa được cấp quyền admin.");
  const name=$("p-name").value.trim();
  if(!name)return toast("Nhập tên sản phẩm.");

  const lines=$("p-pk").value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const pk=[];
  for(const line of lines){
    const idx=line.lastIndexOf("|");
    if(idx<1)return toast('Sai định dạng gói giá: "'+line+'". Dùng Tên gói|Giá.');
    const label=line.slice(0,idx).trim();
    const priceText=line.slice(idx+1).trim().replace(/[,\s]/g,"");
    const price=Number(priceText);
    if(!label||!Number.isFinite(price)||price<0)return toast('Giá không hợp lệ ở dòng: "'+line+'".');
    pk.push({l:label,p:price});
  }

  const existingId=$("p-sel").value;
  const id=existingId||(name.toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"")||"sp")+"-"+Math.random().toString(36).slice(2,6);

  const row={
    id,name,cat:$("p-cat").value.trim(),descr:$("p-desc").value.trim(),
    style:$("p-style").value,img:driveDirect($("p-img").value.trim()),pk
  };
  $("p-save").disabled=true;
  try{
    const {error}=await sb.from("products").upsert(row,{onConflict:"id"});
    if(error){toast("Lỗi lưu sản phẩm/giá: "+error.message);return;}
    toast("Đã lưu sản phẩm và giá.");
    await loadAll();
    $("p-sel").value=id;
    $("p-sel").dispatchEvent(new Event("change"));
  }catch(e){
    toast("Lỗi lưu sản phẩm/giá: "+(e.message||e));
  }finally{$("p-save").disabled=false;}
};

async function confirmOrder(code){
  const {data:o,error}=await sb.from("orders").select("amount").eq("code",code).single();
  if(error)return toast("Không đọc được đơn: "+error.message);
  const need=Number(o?.amount||0);
  const input=prompt(`Đơn ${code}: cần ${fmt(need)}.\nNhập số tiền thực tế đã nhận:`);
  if(input===null)return;
  const received=Number(String(input).replace(/[^0-9]/g,""));
  if(!received||received<need)return toast(`Số tiền ${fmt(received)} chưa đủ ${fmt(need)}.`);
  if(!confirm(`Xác nhận đã nhận ${fmt(received)} cho đơn ${code}?`))return;
  const {error:rpcError}=await sb.rpc("confirm_order",{p_code:code,p_received:received});
  if(rpcError)return toast("Lỗi xác nhận đơn: "+rpcError.message);
  toast("Đã xác nhận đơn "+code);await loadAll();

$("g-file").onchange=()=>{
  const file=$("g-file").files[0];
  if(guidePreviewUrl)URL.revokeObjectURL(guidePreviewUrl);
  guidePreviewUrl="";
  if(!file){
    if(selectedGuide){$("g-preview").src=selectedGuide.video_url||"";$("g-preview").hidden=!selectedGuide.video_url;}
    else $("g-preview").hidden=true;
    return;
  }
  if(file.size>MAX_VIDEO_BYTES){
    $("g-file").value="";$("g-filemsg").textContent="File vượt quá 100 MB.";return;
  }
  if(!["video/mp4","video/webm","video/quicktime"].includes(file.type)){
    $("g-file").value="";$("g-filemsg").textContent="Chỉ hỗ trợ MP4, WebM hoặc MOV.";return;
  }
  guidePreviewUrl=URL.createObjectURL(file);
  $("g-preview").src=guidePreviewUrl;$("g-preview").hidden=false;
  $("g-filemsg").textContent=`${file.name} · ${(file.size/1024/1024).toFixed(1)} MB`;
};
$("g-save").onclick=async()=>{
  const admin=await currentAdmin();
  if(!admin)return toast("Tài khoản chưa được cấp quyền admin.");
  const title=$("g-title").value.trim(),description=$("g-desc").value.trim(),file=$("g-file").files[0];
  if(!title)return toast("Nhập tên hướng dẫn.");
  if(!selectedGuide&&!file)return toast("Chọn video cho hướng dẫn mới.");
  if(file&&file.size>MAX_VIDEO_BYTES)return toast("Video vượt quá 100 MB.");

  let videoUrl=selectedGuide?.video_url||"",videoPath=selectedGuide?.video_path||"";
  const oldPath=videoPath;
  if(file){
    const ext=(file.name.split(".").pop()||"mp4").toLowerCase();
    const path=`${admin.id}/${crypto.randomUUID()}.${ext}`;
    $("g-msg").textContent="Đang tải video lên...";
    const {data:sessionData}=await sb.auth.getSession();
    const token=sessionData?.session?.access_token;
    if(!token){$("g-msg").textContent="Phiên đăng nhập hết hạn.";return;}
    try{
      await new Promise((resolve,reject)=>{
        if(!window.tus?.Upload){reject(new Error("Không tải được thư viện upload."));return;}
        const upload=new tus.Upload(file,{
          endpoint:`${SB_URL}/storage/v1/upload/resumable`,
          retryDelays:[0,1000,3000,5000,10000],
          headers:{authorization:`Bearer ${token}`,apikey:SB_KEY,"x-upsert":"false"},
          uploadDataDuringCreation:true,removeFingerprintOnSuccess:true,
          metadata:{bucketName:GUIDE_BUCKET,objectName:path,contentType:file.type||"video/mp4",cacheControl:"3600"},
          onError:reject,
          onProgress:(a,b)=>{$("g-msg").textContent=`Đang tải: ${Math.round(a/b*100)}%`;},
          onSuccess:resolve
        });
        upload.start();
      });
    }catch(e){$("g-msg").textContent="Lỗi tải video: "+(e.message||e);return;}
    videoPath=path;
    videoUrl=sb.storage.from(GUIDE_BUCKET).getPublicUrl(path).data.publicUrl;
  }
  const row={title,description,video_url:videoUrl,video_path:videoPath,
    is_published:$("g-published").checked,updated_at:new Date().toISOString()};
  const result=selectedGuide
    ?await sb.from("guide_videos").update(row).eq("id",selectedGuide.id)
    :await sb.from("guide_videos").insert(row);
  if(result.error){$("g-msg").textContent="Lỗi lưu: "+result.error.message;return;}
  if(file&&oldPath&&oldPath!==videoPath)await sb.storage.from(GUIDE_BUCKET).remove([oldPath]);
  toast("Đã lưu hướng dẫn.");clearGuideForm();await loadGuideVideos();
};
$("g-del").onclick=async()=>{
  if(!selectedGuide)return toast("Chọn hướng dẫn cần xóa.");
  if(!await currentAdmin())return toast("Không có quyền admin.");
  if(!confirm(`Xóa hướng dẫn "${selectedGuide.title}"?`))return;
  const g=selectedGuide;
  const {error}=await sb.from("guide_videos").delete().eq("id",g.id);
  if(error)return toast("Lỗi xóa: "+error.message);
  if(g.video_path)await sb.storage.from(GUIDE_BUCKET).remove([g.video_path]);
  clearGuideForm();await loadGuideVideos();toast("Đã xóa hướng dẫn.");
};

  if(!confirm(`Xóa phần mềm "${selectedDownload.title}"?`))return;
  const {error}=await sb.from("software_downloads").delete().eq("id",selectedDownload.id);
  if(error)return toast("Không xóa được: "+error.message);
  clearDownloadForm();await loadDownloads();toast("Đã xóa phần mềm.");
};

/* ===== Top 10 ===== */
function renderRankEditor(){
  const options='<option value="">— Không chọn sản phẩm —</option>'+
    products.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
  $("rank-editor").innerHTML=Array.from({length:10},(_,i)=>{
    const rank=i+1;
    return `<div class="guide-item"><label style="margin-top:0;color:var(--txt);font-weight:800">Top ${rank}</label><select class="rank-product" data-rank="${rank}">${options}</select></div>`;
  }).join("");
  document.querySelectorAll(".rank-product").forEach(el=>{
    const rank=Number(el.dataset.rank);
    const p=products.find(x=>Number(x.best_rank)===rank);
    el.value=p?String(p.id):"";
  });
}
async function loadRankEditor(){
  $("rank-msg").textContent="Đang tải xếp hạng...";
  await getProducts();renderRankEditor();$("rank-msg").textContent="";
}
$("rank-reload").onclick=loadRankEditor;
$("rank-save").onclick=async()=>{
  if(!await currentAdmin())return toast("Tài khoản chưa được cấp quyền admin.");
  const selects=[...document.querySelectorAll(".rank-product")];
  const chosen=selects.map(el=>({rank:Number(el.dataset.rank),id:el.value})).filter(x=>x.id);
  if(new Set(chosen.map(x=>x.id)).size!==chosen.length)
    return toast("Một sản phẩm không thể xuất hiện ở nhiều thứ hạng.");

  $("rank-save").disabled=true;$("rank-msg").textContent="Đang lưu...";
  try{
    for(const p of products){
      const item=chosen.find(x=>String(x.id)===String(p.id));
      const {error}=await sb.from("products").update({best_rank:item?item.rank:null}).eq("id",p.id);
      if(error)throw error;
    }
    await getProducts();renderProducts();renderSelects();renderRankEditor();
    $("rank-msg").textContent="Đã lưu xếp hạng Top 10.";
    toast("Đã lưu xếp hạng Top 10.");
  }catch(e){
    $("rank-msg").textContent="Lỗi lưu xếp hạng: "+(e.message||e);
  }finally{$("rank-save").disabled=false;}
};

/* ===== Chuyển tab ===== */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  ["prod","ranking","keys","orders","guides","downloads"].forEach(t=>{
    $("t-"+t).hidden=t!==b.dataset.t;
  });
  if(b.dataset.t==="ranking")loadRankEditor();
  if(b.dataset.t==="guides")loadGuideVideos();
  if(b.dataset.t==="downloads")loadDownloads();
});
</script>
